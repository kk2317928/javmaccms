name: Import original MACCMS10
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror upstream master to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare --filter=blob:none https://github.com/magicblack/maccms10.git upstream.git
          cd upstream.git
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push --force https://github.com/kk2317928/javmaccms.git refs/heads/master:refs/heads/main
