name: Import original MACCMS10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy pinned upstream history to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare https://github.com/magicblack/maccms10.git upstream.git
          cd upstream.git
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push --force https://github.com/kk2317928/javmaccms.git a468b6236c1e028b1aca3f91f463345cf72f16c7:refs/heads/main
